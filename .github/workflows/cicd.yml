name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SITE_URL: https://avi-chatapp.duckdns.org

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - name: Keep the jar for the deploy job
        run: cp target/*.jar app.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: app.jar

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Copy jar to EC2 and restart the app
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 600 key.pem
          scp -i key.pem -o StrictHostKeyChecking=no app.jar "$EC2_USER@$EC2_HOST:/home/$EC2_USER/app/app.jar.new"
          ssh -i key.pem -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" \
            "mv /home/$EC2_USER/app/app.jar.new /home/$EC2_USER/app/app.jar && sudo systemctl restart chatapp"
          rm -f key.pem

      - name: Health check (the live HTTPS site must answer)
        run: curl -fsS --retry 8 --retry-delay 5 --retry-all-errors "$SITE_URL/api/chat/users"