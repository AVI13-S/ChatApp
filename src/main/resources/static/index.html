<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Group Chat</title>
    <style>
        :root {
            --bg: #eef1f5; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
            --accent: #2563eb; --mine: #dbeafe; --other: #f3f4f6; --line: #e5e7eb; --error: #dc2626; --ok: #16a34a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1216; --card: #181d24; --text: #e5e7eb; --muted: #9ca3af;
                --accent: #3b82f6; --mine: #1e3a5f; --other: #232a33; --line: #2a323d; --error: #f87171; --ok: #4ade80;
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center; padding: 12px;
        }
        .card {
            background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            width: 100%; max-width: 640px; height: min(88dvh, 720px);
            display: flex; flex-direction: column; overflow: hidden;
        }
        header {
            padding: 12px 16px; border-bottom: 1px solid var(--line);
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        header h1 { font-size: 17px; margin: 0; }
        #status { font-size: 12px; color: var(--muted); }
        #status.live { color: var(--ok); }
        #online { font-size: 12px; color: var(--muted); text-align: right; flex: 1; }
        #joinView { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px; gap: 12px; }
        #chatView { flex: 1; display: none; flex-direction: column; min-height: 0; }
        input[type=text] {
            padding: 12px; border: 1px solid var(--line); border-radius: 10px;
            background: var(--bg); color: var(--text); font-size: 16px; width: 100%;
        }
        button {
            padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent);
            color: #fff; font-size: 16px; cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: default; }
        button.ghost {
            background: transparent; color: var(--muted); border: 1px solid var(--line);
            padding: 6px 12px; font-size: 13px;
        }
        #messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; background: var(--other); align-self: flex-start; }
        .msg.mine { background: var(--mine); align-self: flex-end; }
        .who { font-size: 12px; font-weight: 600; color: var(--muted); }
        .time { font-weight: 400; margin-left: 6px; font-size: 11px; }
        .text { white-space: pre-wrap; word-break: break-word; }
        .empty { margin: auto; color: var(--muted); font-size: 14px; }
        #sendForm { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
        .error { color: var(--error); font-size: 13px; min-height: 18px; padding: 0 16px; }
        #joinError { padding: 0; }
    </style>
</head>
<body>
<div class="card">
    <header>
        <h1>Group Chat</h1>
        <div id="online"></div>
        <span id="status"></span>
        <button id="leaveBtn" class="ghost" style="display:none">Leave</button>
    </header>

    <div id="joinView">
        <div>Choose a name to join the chat</div>
        <input type="text" id="usernameInput" placeholder="Your name (max 30 characters)" maxlength="30" autocomplete="off">
        <button id="joinBtn">Join chat</button>
        <div class="error" id="joinError"></div>
    </div>

    <div id="chatView">
        <div id="messages"><div class="empty" id="emptyNote">No messages yet. Say hi!</div></div>
        <div class="error" id="chatError"></div>
        <form id="sendForm">
            <input type="text" id="messageInput" placeholder="Type a message..." maxlength="1000" autocomplete="off">
            <button type="submit" id="sendBtn">Send</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
    const API = '/api/chat';

    const $ = id => document.getElementById(id);
    const seen = new Set();
    let me = null;
    let client = null;

    /* ---------- small REST helper (join, leave, history, users) ---------- */
    async function request(path, method, body) {
        const res = await fetch(API + path, {
            method: method || 'GET',
            headers: { 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined
        });
        if (res.status === 204) {
            return null;
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            const detail = data.errors && data.errors.length
                ? data.errors.map(e => e.field + ' ' + e.defaultMessage).join(', ')
                : data.message;
            throw new Error(detail || ('Request failed (' + res.status + ')'));
        }
        return data;
    }

    /* ---------- join / leave ---------- */
    $('joinBtn').onclick = async () => {
        $('joinError').textContent = '';
        if (typeof StompJs === 'undefined') {
            $('joinError').textContent = 'Could not load the chat library. Check your internet connection and reload.';
            return;
        }
        const name = $('usernameInput').value.trim();
        $('joinBtn').disabled = true;
        try {
            await request('/join', 'POST', { username: name });
            me = name;
            showChat();
            connect();
        } catch (e) {
            $('joinError').textContent = e.message;
        }
        $('joinBtn').disabled = false;
    };
    $('usernameInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') { $('joinBtn').click(); }
    });

    $('leaveBtn').onclick = async () => {
        try { await request('/leave', 'POST', { username: me }); } catch (e) { /* ignore */ }
        if (client) { client.deactivate(); }
        location.reload();
    };

    function showChat() {
        $('joinView').style.display = 'none';
        $('chatView').style.display = 'flex';
        $('leaveBtn').style.display = 'inline-block';
        $('messageInput').focus();
    }

    /* ---------- WebSocket (STOMP) ---------- */
    function setStatus(text, live) {
        $('status').textContent = text;
        $('status').className = live ? 'live' : '';
    }

    function connect() {
        // https page => secure wss:// connection, http page => ws://
        const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
        setStatus('connecting...', false);

        client = new StompJs.Client({
            brokerURL: scheme + location.host + '/ws',
            connectHeaders: { username: me },
            reconnectDelay: 0,      // the server frees your seat on disconnect, so rejoin manually
            onConnect: () => {
                setStatus('\u25CF live', true);
                client.subscribe('/topic/messages', frame => addMessage(JSON.parse(frame.body)));
                client.subscribe('/topic/users', frame => showUsers(JSON.parse(frame.body)));
                client.subscribe('/user/queue/errors', frame => showError(frame.body));
                loadUsers();
                loadHistory();
            },
            onStompError: frame => showError(frame.headers['message'] || 'Connection error'),
            onWebSocketClose: () => {
                if (me) { setStatus('disconnected - reload the page', false); }
            }
        });
        client.activate();
    }

    async function loadHistory() {
        try {
            const messages = await request('/messages');
            messages.forEach(addMessage);
        } catch (e) { /* ignore */ }
    }

    async function loadUsers() {
        try {
            showUsers(await request('/users'));
        } catch (e) { /* ignore */ }
    }

    function showUsers(users) {
        $('online').textContent = users.length + ' online: ' + users.map(u => u.username).join(', ');
    }

    /* ---------- messages ---------- */
    function toDate(value) {
        if (Array.isArray(value)) {
            return new Date(Date.UTC(value[0], value[1] - 1, value[2], value[3] || 0, value[4] || 0, value[5] || 0));
        }
        // The server sends LocalDateTime in UTC (EC2 default), so mark it as UTC
        const iso = /Z|[+-]\d\d:?\d\d$/.test(value) ? value : value + 'Z';
        return new Date(iso);
    }

    function addMessage(m) {
        if (seen.has(m.id)) {
            return;
        }
        seen.add(m.id);
        const empty = $('emptyNote');
        if (empty) { empty.remove(); }

        const box = $('messages');
        const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 100;
        const mine = m.sender.toLowerCase() === (me || '').toLowerCase();

        const div = document.createElement('div');
        div.className = 'msg' + (mine ? ' mine' : '');
        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = m.sender;
        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = toDate(m.sentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        who.appendChild(time);
        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = m.content;      // textContent => no HTML injection
        div.append(who, text);
        box.appendChild(div);

        if (nearBottom || mine) { box.scrollTop = box.scrollHeight; }
    }

    function showError(message) {
        $('chatError').textContent = message;
        setTimeout(() => { $('chatError').textContent = ''; }, 5000);
    }

    $('sendForm').onsubmit = e => {
        e.preventDefault();
        const content = $('messageInput').value.trim();
        if (!content) { return; }
        if (!client || !client.connected) {
            showError('Not connected. Reload the page and join again.');
            return;
        }
        client.publish({
            destination: '/app/chat.send',
            body: JSON.stringify({ sender: me, content: content })
        });
        $('messageInput').value = '';
        $('messageInput').focus();
    };
</script>
</body>
</html>
