<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Group Chat</title>
    <style>
        :root {
            --bg: #dbeafe; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
            --accent: #2563eb; --accent-dark: #1d4ed8; --other: #f3f4f6; --line: #e5e7eb; --error: #dc2626;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1216; --card: #181d24; --text: #e5e7eb; --muted: #9ca3af;
                --accent: #3b82f6; --accent-dark: #2563eb; --other: #232a33; --line: #2a323d; --error: #f87171;
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: system-ui, "Segoe UI", sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; justify-content: center; align-items: center; padding: 12px;
        }
        .card {
            width: 100%; max-width: 640px; height: min(90dvh, 740px);
            background: var(--card); border-radius: 20px; overflow: hidden;
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.18);
            display: flex; flex-direction: column;
        }

        header {
            padding: 14px 18px; border-bottom: 1px solid var(--line);
            display: flex; align-items: center; gap: 12px;
        }
        .logo {
            width: 42px; height: 42px; border-radius: 50%; color: #fff; font-size: 18px; font-weight: bold;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex; align-items: center; justify-content: center;
        }
        .title { flex: 1; }
        .title h1 { margin: 0; font-size: 17px; }
        .title span { font-size: 12px; color: var(--muted); }
        #status { font-size: 12px; color: var(--muted); display: none; align-items: center; gap: 5px; }
        #dot { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; }
        #leaveBtn {
            display: none; background: none; color: var(--accent); cursor: pointer;
            border: 1px solid var(--accent); border-radius: 999px; padding: 5px 14px; font-size: 13px;
        }

        #joinView {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px; gap: 12px; text-align: center;
        }
        #joinView h2 { margin: 0; }
        #joinView p { margin: 0; max-width: 300px; font-size: 14px; color: var(--muted); }
        #joinView input, #joinView button { width: 100%; max-width: 300px; }

        input[type=text] {
            padding: 12px 16px; font-size: 16px; color: var(--text); background: var(--other);
            border: 1px solid var(--line); border-radius: 12px;
        }
        input[type=text]:focus { outline: 2px solid var(--accent); }
        .blue-button {
            padding: 12px 18px; font-size: 16px; color: #fff; background: var(--accent);
            border: 0; border-radius: 12px; cursor: pointer;
        }
        .blue-button:hover { background: var(--accent-dark); }
        .error { min-height: 18px; padding: 0 18px; font-size: 13px; color: var(--error); }
        #joinError { padding: 0; }

        #chatView { flex: 1; min-height: 0; display: none; flex-direction: column; }
        #messages {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .empty { margin: auto; font-size: 14px; color: var(--muted); }
        .message { max-width: 78%; padding: 8px 12px; border-radius: 16px 16px 16px 4px; background: var(--other); }
        .message.mine { align-self: flex-end; color: #fff; background: var(--accent); border-radius: 16px 16px 4px 16px; }
        .sender { font-size: 12px; font-weight: bold; margin-bottom: 2px; }
        .text { white-space: pre-wrap; word-break: break-word; }
        .info { display: flex; justify-content: flex-end; gap: 10px; margin-top: 2px; font-size: 11px; opacity: 0.75; }
        .delete { display: none; padding: 0; font-size: 11px; color: #fff; background: none; border: 0; cursor: pointer; }
        .message.mine:hover .delete { display: inline; }
        @media (hover: none) { .message.mine .delete { display: inline; } }

        #sendForm { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
        #messageInput { flex: 1; border-radius: 999px; }
        #sendBtn { width: 46px; height: 46px; padding: 0; border-radius: 50%; }
    </style>
</head>
<body>
<div class="card">
    <header>
        <div class="logo">G</div>
        <div class="title">
            <h1>Group Chat</h1>
            <span id="subtitle">Chat with your friends</span>
        </div>
        <div id="status"><span id="dot"></span><span id="statusText"></span></div>
        <button id="leaveBtn">Leave</button>
    </header>

    <div id="joinView">
        <h2>Join the chat</h2>
        <p>Enter a name to start. You will only see the messages sent after you join.</p>
        <input type="text" id="nameInput" placeholder="Your name" maxlength="30" autocomplete="off">
        <button class="blue-button" id="joinBtn">Join</button>
        <div class="error" id="joinError"></div>
    </div>

    <div id="chatView">
        <div id="messages">
            <div class="empty" id="emptyText">No messages yet</div>
        </div>
        <div class="error" id="chatError"></div>
        <form id="sendForm">
            <input type="text" id="messageInput" placeholder="Type a message" maxlength="1000" autocomplete="off">
            <button class="blue-button" type="submit" id="sendBtn">&#10148;</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script>
    // on localhost and EC2 the api is on the same address, on Render we call the EC2 server
    const EC2_URL = 'https://avi-chatapp.duckdns.org';
    let serverUrl = EC2_URL;
    if (location.hostname === 'localhost' || location.hostname === 'avi-chatapp.duckdns.org') {
        serverUrl = location.origin;
    }
    const apiUrl = serverUrl + '/api/chat';
    const wsUrl = serverUrl.replace('http', 'ws') + '/ws';

    const nameColors = ['#1d4ed8', '#0369a1', '#4338ca', '#0e7490', '#6d28d9', '#0f766e'];

    let myName = '';
    let stompClient = null;

    function el(id) {
        return document.getElementById(id);
    }

    async function callApi(path, method, body) {
        const response = await fetch(apiUrl + path, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined
        });
        if (response.status === 204) {
            return null;
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(data.message || 'Something went wrong');
        }
        return data;
    }

    async function joinChat() {
        const name = el('nameInput').value.trim();
        if (name === '') {
            el('joinError').textContent = 'Please enter a name';
            return;
        }
        if (typeof StompJs === 'undefined') {
            el('joinError').textContent = 'Could not load the chat library. Check your internet and reload.';
            return;
        }

        try {
            await callApi('/join', 'POST', { username: name });
        } catch (error) {
            el('joinError').textContent = error.message;
            return;
        }

        myName = name;
        el('joinView').style.display = 'none';
        el('chatView').style.display = 'flex';
        el('leaveBtn').style.display = 'block';
        el('status').style.display = 'flex';
        el('subtitle').textContent = 'You are ' + myName;
        el('messageInput').focus();
        connectSocket();
    }

    async function leaveChat() {
        try {
            await callApi('/leave', 'POST', { username: myName });
        } catch (error) {
            // nothing to do, we are leaving anyway
        }
        if (stompClient) {
            stompClient.deactivate();
        }
        location.reload();
    }

    function setStatus(text, color) {
        el('statusText').textContent = text;
        el('dot').style.background = color;
    }

    function connectSocket() {
        setStatus('connecting', '#fbbf24');

        stompClient = new StompJs.Client({
            brokerURL: wsUrl,
            connectHeaders: { username: myName },
            reconnectDelay: 0,
            onConnect: () => {
                setStatus('live', '#22c55e');
                stompClient.subscribe('/topic/messages', frame => showMessage(JSON.parse(frame.body)));
                stompClient.subscribe('/topic/deleted', frame => removeMessage(cleanText(frame.body)));
                stompClient.subscribe('/user/queue/errors', frame => handleError(cleanText(frame.body)));
            },
            onWebSocketClose: () => {
                if (myName !== '') {
                    setStatus('disconnected, reload the page', '#ef4444');
                }
            }
        });
        stompClient.activate();
    }

    // text that comes through the websocket can have quotes around it
    function cleanText(text) {
        return text.replace(/^"|"$/g, '');
    }

    function nameColor(name) {
        let total = 0;
        for (let i = 0; i < name.length; i++) {
            total = total + name.charCodeAt(i);
        }
        return nameColors[total % nameColors.length];
    }

    function showMessage(message) {
        const isMine = message.sender.toLowerCase() === myName.toLowerCase();

        const box = document.createElement('div');
        box.className = isMine ? 'message mine' : 'message';
        box.dataset.id = message.id;

        if (!isMine) {
            const sender = document.createElement('div');
            sender.className = 'sender';
            sender.style.color = nameColor(message.sender);
            sender.textContent = message.sender;
            box.appendChild(sender);
        }

        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = message.content;
        box.appendChild(text);

        const info = document.createElement('div');
        info.className = 'info';
        if (isMine) {
            const deleteButton = document.createElement('button');
            deleteButton.className = 'delete';
            deleteButton.textContent = 'Delete';
            deleteButton.onclick = () => deleteMessage(message.id);
            info.appendChild(deleteButton);
        }
        const time = document.createElement('span');
        time.textContent = new Date(message.sentAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        info.appendChild(time);
        box.appendChild(info);

        const list = el('messages');
        const emptyText = el('emptyText');
        if (emptyText) {
            emptyText.remove();
        }
        const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
        list.appendChild(box);
        if (atBottom || isMine) {
            list.scrollTop = list.scrollHeight;
        }
    }

    function removeMessage(id) {
        const box = document.querySelector('[data-id="' + id + '"]');
        if (box) {
            box.remove();
        }
    }

    async function deleteMessage(id) {
        try {
            await callApi('/messages/' + id + '?username=' + encodeURIComponent(myName), 'DELETE');
        } catch (error) {
            showError(error.message);
        }
    }

    function sendMessage(event) {
        event.preventDefault();
        const text = el('messageInput').value.trim();
        if (text === '') {
            return;
        }
        if (!stompClient || !stompClient.connected) {
            showError('Not connected, please reload the page');
            return;
        }
        stompClient.publish({
            destination: '/app/chat.send',
            body: JSON.stringify({ sender: myName, content: text })
        });
        el('messageInput').value = '';
    }

    function showError(text) {
        el('chatError').textContent = text;
        setTimeout(() => { el('chatError').textContent = ''; }, 5000);
    }

    // if the server forgot us (after a refresh for example) join again
    async function handleError(text) {
        showError(text);
        if (text.toLowerCase().includes('join the chat first')) {
            try {
                await callApi('/join', 'POST', { username: myName });
                showError('You are back in the chat, please send your message again');
            } catch (error) {
                showError(error.message);
            }
        }
    }

    el('joinBtn').onclick = joinChat;
    el('nameInput').onkeydown = event => {
        if (event.key === 'Enter') {
            joinChat();
        }
    };
    el('leaveBtn').onclick = leaveChat;
    el('sendForm').onsubmit = sendMessage;
</script>
</body>
</html>
